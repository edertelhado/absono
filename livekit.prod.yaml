port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

redis:
  address: redis:6379

keys:
  devkey: absono-livekit-dev-secret-32-chars!!

# TURN embutido: relay para usuários atrás de NAT/firewall restritivo.
# TURN/UDP não exige certificado; abrir 3478/udp no firewall da VPS.
turn:
  enabled: true
  udp_port: 3478

logging:
  level: info

webhook:
  api_key: devkey
  urls:
    - http://backend:8080/api/livekit/webhook
