# Stack completa para VPS — sobe com: docker compose -f compose.prod.yml up -d --build
# URLs públicas derivam de PUBLIC_APP_DOMAIN e PUBLIC_S3_DOMAIN definidos no .env
# (Caddy emite o TLS via sslip.io ou domínio próprio).

services:
  postgres:
    image: postgres:16-alpine
    container_name: absono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-absono}
      POSTGRES_USER: ${POSTGRES_USER:-absono}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-absono_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absono"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: absono-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: absono-garage
    restart: unless-stopped
    ports:
      - "${GARAGE_S3_PORT:-3902}:3902"
    volumes:
      - garage_data:/var/lib/garage
      - ./garage.toml:/etc/garage.toml
    command: ["/garage", "-c", "/etc/garage.toml", "server"]

  livekit:
    image: livekit/livekit-server:latest
    container_name: absono-livekit
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml
    command: ["--config", "/etc/livekit.yaml"]

  backend:
    build: ./backend
    container_name: absono-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-absono}
      POSTGRES_USER: ${POSTGRES_USER:-absono}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-absono_secret}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      LIVEKIT_URL: "wss://${PUBLIC_APP_DOMAIN}:${HTTPS_PORT:-443}/livekit"
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-absono-livekit-dev-secret-32-chars!!}
      GARAGE_ENDPOINT: "https://${PUBLIC_S3_DOMAIN}:${HTTPS_PORT:-443}"
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-garage_access_key}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY:-garage_secret_key}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-absono}
      GARAGE_REGION: ${GARAGE_REGION:-garage}

  frontend:
    build: ./frontend
    container_name: absono-frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: absono-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - livekit
      - garage
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      PUBLIC_APP_DOMAIN: ${PUBLIC_APP_DOMAIN:?Defina PUBLIC_APP_DOMAIN no .env - ex 201-71-20-54.sslip.io}
      PUBLIC_S3_DOMAIN: ${PUBLIC_S3_DOMAIN:?Defina PUBLIC_S3_DOMAIN no .env - ex s3.201-71-20-54.sslip.io}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    volumes:
      - ${CADDYFILE:-./Caddyfile.prod}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  garage_data:
  caddy_data:
  caddy_config:
